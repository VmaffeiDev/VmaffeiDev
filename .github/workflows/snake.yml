# Salve este arquivo em: .github/workflows/snake.yml
# Ele gera a animação da cobrinha comendo o gráfico de contribuições.
# Depois do primeiro run, vá em Settings > Actions > General e confirme que
# "Workflow permissions" está em "Read and write permissions".

name: Gerar cobrinha das contribuições

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gerar o SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#A855F7&color_dots=#0A0F2E,#3B1E6E,#7C3AED,#A855F7,#E4A8FF

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
